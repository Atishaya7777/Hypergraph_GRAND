# HyperGRAND Diffusion Study Configuration
# Example configuration for clustering tasks

# Model architecture
hidden_dim: 32
num_layers: 2
alpha: 0.1
dropout: 0.1

# Integration scheme: explicit, implicit, adaptive
integration_scheme: explicit

# Attention mechanism
use_attention: true
attention_type: full

# Training parameters
epochs: 200
patience: 30
lr: 0.001
weight_decay: 0.00001

# Study metadata
study_dimension: baseline
config_variant: baseline_clustering
